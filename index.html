<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NineX Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070A13;
      --surface: #0E1626;
      --card: rgba(22, 34, 56, 0.7);
      --primary: #00E676;
      --accent: #2979FF;
      --text: #F8FAFC;
      --text-dim: #94A3B8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; }
    .screen { width: 100vw; height: 100vh; max-width: 480px; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    
    .header { padding: 18px 20px; background: rgba(14, 22, 38, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .view-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 140px; }
    .tab-view { display: none; flex-direction: column; height: 100%; }
    .tab-view.active { display: flex; }

    .chat-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .bubble { max-width: 78%; padding: 12px 16px; border-radius: 20px; font-size: 14.5px; line-height: 1.4; }
    .bubble.in { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .bubble.out { background: linear-gradient(135deg, #00C853, #009624); align-self: flex-end; border-bottom-right-radius: 4px; color: #FFF; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }
    .sticker { font-size: 65px; align-self: flex-start; }

    .dock { position: absolute; bottom: 72px; left: 0; right: 0; padding: 12px 16px; background: rgba(14, 22, 38, 0.95); backdrop-filter: blur(20px); display: flex; gap: 10px; border-top: 1px solid var(--border); }
    .dock input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 30px; padding: 12px 20px; color: #FFF; font-size: 14px; outline: none; }
    .dock button { width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--primary); color: #000; font-size: 18px; font-weight: bold; cursor: pointer; }

    .call-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    .call-card { aspect-ratio: 1; background: var(--card); border-radius: 24px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .call-avatar { font-size: 45px; }

    .navbar { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(7, 10, 19, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { background: none; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

<div class="screen">
  <div class="header">
    <h1>NINEX</h1>
    <div onclick="addSticker()" style="font-size: 22px; cursor: pointer;">✨🔥</div>
  </div>

  <div class="view-container">
    <div id="chatsView" class="tab-view active">
      <div class="chat-body" id="chatList">
        <div class="bubble in">Welcome to NineX Messenger! 🚀</div>
        <div class="bubble out">Performance and UI look ultra premium! 🔥</div>
      </div>
      <div class="dock">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()" />
        <button onclick="send()">➤</button>
      </div>
    </div>

    <div id="callsView" class="tab-view">
      <div style="padding: 20px 16px 5px; font-weight: 700; color: var(--text-dim); font-size: 13px;">ACTIVE SECURE CALLS</div>
      <div class="call-grid">
        <div class="call-card"><div class="call-avatar">👨‍💻</div><b>Rameshwar</b></div>
        <div class="call-card"><div class="call-avatar">🚀</div><b>Alex</b></div>
        <div class="call-card"><div class="call-avatar">🎧</div><b>Sarah</b></div>
        <div class="call-card"><div class="call-avatar">⚡</div><b>Nova</b></div>
      </div>
    </div>
  </div>

  <div class="navbar">
    <button class="nav-item active" onclick="switchTab('chatsView', this)"><span>💬</span>CHATS</button>
    <button class="nav-item" onclick="switchTab('callsView', this)"><span>📞</span>CALLS</button>
  </div>
</div>

<script>
  function switchTab(viewId, el) {
    document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    el.classList.add('active');
  }

  function send() {
    const box = document.getElementById('chatInput');
    const val = box.value.trim();
    if (!val) return;
    const list = document.getElementById('chatList');
    
    const out = document.createElement('div');
    out.className = 'bubble out';
    out.innerText = val;
    list.appendChild(out);
    box.value = '';
    list.scrollTop = list.scrollHeight;

    setTimeout(() => {
      const rep = document.createElement('div');
      rep.className = 'bubble in';
      rep.innerText = "Message received via NineX encrypted server! ✅";
      list.appendChild(rep);
      list.scrollTop = list.scrollHeight;
    }, 500);
  }

  function addSticker() {
    const list = document.getElementById('chatList');
    const st = document.createElement('div');
    st.className = 'sticker';
    const emojis = ['🔥', '⚡', '🐯', '🚀', '👑', '🎉'];
    st.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    list.appendChild(st);
    list.scrollTop = list.scrollHeight;
  }
</script>
</body>
</html>

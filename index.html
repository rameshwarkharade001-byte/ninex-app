<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NineX - Social Ecosystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Official SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #121212;
      --card-border: #262626;
      --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent-neon: #00E676;
      --accent-cyan: #00E5FF;
      --text-pri: #ffffff;
      --text-sec: #a8a8a8;
      --bubble-me: #3797f0;
      --bubble-them: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #000;
      color: var(--text-pri);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      position: relative;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
    }

    /* AUTH OVERLAY (INSTAGRAM STYLE LOGIN & GOOGLE AUTH) */
    #authOverlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }
    .insta-logo-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--insta-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-input {
      width: 100%;
      background: #121212;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: #555; }
    .primary-btn {
      width: 100%;
      background: #3797f0;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .google-btn {
      width: 100%;
      background: #ffffff;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .divider-row {
      display: flex;
      align-items: center;
      margin: 8px 0;
      color: var(--text-sec);
      font-size: 11px;
      font-weight: 600;
    }
    .divider-row::before, .divider-row::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }
    .divider-row span { padding: 0 10px; }

    /* HEADER */
    .top-nav {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px);
      z-index: 50;
    }
    .nav-brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--insta-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-icons { display: flex; gap: 18px; font-size: 20px; align-items: center; }

    /* MAIN TABS */
    .screen-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 60px;
    }
    .screen-panel.active { display: flex; }

    /* STORIES & FEED */
    .stories-container {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--card-border);
    }
    .stories-container::-webkit-scrollbar { display: none; }
    .story-node { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--insta-gradient);
    }
    .story-img-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #262626;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }
    .story-title { font-size: 11px; color: var(--text-sec); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* SEARCH BAR */
    .search-wrap { padding: 10px 16px; border-bottom: 1px solid var(--card-border); }
    .search-input-field {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid var(--card-border);
      padding: 9px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    /* DIRECT CHATS */
    .messages-stream { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 20px; font-size: 13.5px; line-height: 1.4; word-break: break-word; }
    .chat-bubble.mine { align-self: flex-end; background: var(--bubble-me); color: #fff; border-bottom-right-radius: 4px; }
    .chat-bubble.theirs { align-self: flex-start; background: var(--bubble-them); color: #fff; border-bottom-left-radius: 4px; }
    .bubble-author { font-size: 10px; font-weight: 700; color: #00E5FF; margin-bottom: 2px; }
    .bubble-meta { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: right; }

    .bottom-input-bar {
      position: absolute;
      bottom: 58px;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: #000;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 30;
    }
    .bottom-input-bar input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 9px 16px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .send-msg-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3797f0;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* VOOM REELS FEED */
    .reels-feed-box { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .reel-slot { height: calc(100vh - 114px); position: relative; scroll-snap-align: start; background: #000; display: flex; align-items: center; justify-content: center; }
    .reel-slot video { width: 100%; height: 100%; object-fit: cover; }
    .reel-meta-info { position: absolute; bottom: 20px; left: 16px; z-index: 10; }
    .reel-meta-user { font-weight: 700; font-size: 14px; margin-bottom: 4px; }

    /* HARDWARE CAMERA */
    .lens-viewport { flex: 1; margin: 12px; border-radius: 22px; background: #000; position: relative; overflow: hidden; border: 1px solid var(--card-border); }
    .lens-viewport video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .lens-overlay-emoji { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 90px; pointer-events: none; }
    .lens-dock { height: 60px; display: flex; gap: 12px; padding: 0 16px; align-items: center; overflow-x: auto; }
    .lens-picker-btn { width: 44px; height: 44px; border-radius: 50%; background: #1a1a1a; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; }

    /* REAL PROFILE */
    .user-profile-view { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .main-avatar-circle { width: 80px; height: 80px; border-radius: 50%; padding: 3px; background: var(--insta-gradient); margin-bottom: 12px; }
    .main-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #121212; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; border: 2px solid #000; }
    .stat-row { display: flex; justify-content: space-around; width: 100%; margin: 20px 0; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); padding: 12px 0; }
    .stat-node { text-align: center; }
    .stat-node b { font-size: 16px; display: block; }
    .stat-node span { font-size: 12px; color: var(--text-sec); }

    /* BOTTOM DOCK */
    .app-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #000;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .dock-action {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      transition: transform 0.15s;
    }
    .dock-action.active { color: #3797f0; }
    .dock-action:active { transform: scale(0.85); }
  </style>
</head>
<body>

<div class="app-viewport">

  <!-- AUTHENTICATION SCREEN -->
  <div id="authOverlay">
    <div class="insta-logo-text">NineX</div>
    
    <div class="auth-card">
      <button class="google-btn" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="G" />
        Continue with Google
      </button>

      <div class="divider-row"><span>OR</span></div>

      <input type="text" id="inputUsername" class="auth-input" placeholder="Username (e.g. rahul_99)" />
      <input type="email" id="inputEmail" class="auth-input" placeholder="Email" />
      <input type="password" id="inputPassword" class="auth-input" placeholder="Password" />

      <button class="primary-btn" id="submitAuthBtn" onclick="handleEmailAuth()">Sign Up</button>
      
      <div id="authErrorDisplay" style="color:#ff3b30; font-size:12px; text-align:center; display:none;"></div>
      
      <p style="font-size: 12px; color: var(--text-sec); text-align: center; margin-top: 10px; cursor:pointer;" id="switchModeTxt" onclick="toggleAuthScreens()">
        Already have an account? <b style="color:#3797f0;">Log In</b>
      </p>
    </div>
  </div>

  <!-- TOP APP HEADER -->
  <div class="top-nav">
    <div class="nav-brand">NineX</div>
    <div class="nav-icons">
      <i class="fa-regular fa-heart" onclick="alert('No new notifications')"></i>
      <i class="fa-solid fa-arrow-right-from-bracket" onclick="logUserOut()" title="Logout" style="font-size: 17px; opacity:0.8;"></i>
    </div>
  </div>

  <!-- 1. LIVE CHAT & SEARCH TAB -->
  <div id="chatsTab" class="screen-panel active">
    <!-- Stories Carousel -->
    <div class="stories-container" id="storiesRow">
      <div class="story-node">
        <div class="story-circle"><div class="story-img-placeholder" id="myStoryIcon">+</div></div>
        <span class="story-title">Your Story</span>
      </div>
    </div>

    <!-- Search Users -->
    <div class="search-wrap">
      <input type="text" id="liveUserSearch" class="search-input-field" placeholder="🔍 Search real users..." oninput="filterRealUsers()" />
    </div>
    <div id="searchResultsList" style="display:none; max-height:120px; overflow-y:auto; padding:0 16px; border-bottom:1px solid var(--card-border);"></div>

    <!-- Live Messages -->
    <div class="messages-stream" id="messagesStream"></div>

    <!-- Compose -->
    <div class="bottom-input-bar">
      <input type="text" id="msgInputField" placeholder="Message..." onkeydown="if(event.key==='Enter') pushNewMessage()" />
      <button class="send-msg-btn" onclick="pushNewMessage()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>

  <!-- 2. REAL VOOM REELS FEED -->
  <div id="voomTab" class="screen-panel">
    <div style="padding:10px 16px; display:flex; justify-content:space-between; align-items:center; background:#000;">
      <span style="font-weight:700; font-size:14px;">Reels</span>
      <input type="file" id="reelVideoInput" accept="video/*" style="display:none;" onchange="handleReelUpload(event)" />
      <button onclick="document.getElementById('reelVideoInput').click()" style="background:#3797f0; color:#fff; border:none; padding:6px 14px; border-radius:16px; font-weight:700; font-size:12px; cursor:pointer;">+ Post Reel</button>
    </div>
    <div class="reels-feed-box" id="reelsFeed">
      <div style="padding:60px 20px; text-align:center; color:var(--text-sec);">
        <i class="fa-solid fa-clapperboard" style="font-size:36px; margin-bottom:12px; color:#3797f0;"></i>
        <p>No reels yet. Be the first to share one!</p>
      </div>
    </div>
  </div>

  <!-- 3. REAL HARDWARE LENS (SNAPCHAT-STYLE CAMERA) -->
  <div id="lensTab" class="screen-panel">
    <div class="lens-viewport">
      <video id="cameraElement" autoplay playsinline muted></video>
      <div class="lens-overlay-emoji" id="activeEmojiFilter">👑</div>
    </div>
    <div class="lens-dock">
      <div class="lens-picker-btn" onclick="setLens('👑')">👑</div>
      <div class="lens-picker-btn" onclick="setLens('🕶️')">🕶️</div>
      <div class="lens-picker-btn" onclick="setLens('🔥')">🔥</div>
      <div class="lens-picker-btn" onclick="setLens('🐯')">🐯</div>
      <div class="lens-picker-btn" onclick="setLens('⚡')">⚡</div>
    </div>
  </div>

  <!-- 4. REAL PROFILE TAB -->
  <div id="profileTab" class="screen-panel">
    <div class="user-profile-view">
      <div class="main-avatar-circle">
        <div class="main-avatar-inner" id="profileBadge">U</div>
      </div>
      <h3 id="profileNameDisplay">Username</h3>
      <p id="profileHandleDisplay" style="color:var(--text-sec); font-size:13px; margin-top:2px;">@username</p>
      
      <div class="stat-row">
        <div class="stat-node"><b id="postsNum">0</b><span>Posts</span></div>
        <div class="stat-node"><b>100%</b><span>Secure</span></div>
        <div class="stat-node"><b style="color:var(--accent-neon);">Online</b><span>Status</span></div>
      </div>

      <button onclick="logUserOut()" style="width:100%; max-width:240px; background:#262626; color:#ff3b30; border:none; padding:10px; border-radius:8px; font-weight:700; cursor:pointer;">Log Out</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION DOCK -->
  <div class="app-dock">
    <button class="dock-action active" onclick="switchTab('chatsTab', this)"><i class="fa-solid fa-house"></i></button>
    <button class="dock-action" onclick="switchTab('voomTab', this)"><i class="fa-solid fa-play"></i></button>
    <button class="dock-action" onclick="switchTab('lensTab', this)"><i class="fa-solid fa-camera"></i></button>
    <button class="dock-action" onclick="switchTab('profileTab', this)"><i class="fa-regular fa-user"></i></button>
  </div>
</div>

<script>
  // 100% Verified Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAkCC-P2VyQ9c8tGZakGjSA3YXLbvSvV5M",
    authDomain: "ninex-messenger.firebaseapp.com",
    databaseURL: "https://ninex-messenger-default-rtdb.firebaseio.com",
    projectId: "ninex-messenger",
    storageBucket: "ninex-messenger.firebasestorage.app",
    messagingSenderId: "673406390185",
    appId: "1:673406390185:web:8b1a566ef371231a9a3eb8",
    measurementId: "G-GCQT6WGKGN"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let isRegister = true;
  let activeUser = null;
  let registeredDirectory = {};

  // Auth Toggle
  function toggleAuthScreens() {
    isRegister = !isRegister;
    document.getElementById('inputUsername').style.display = isRegister ? 'block' : 'none';
    document.getElementById('submitAuthBtn').innerText = isRegister ? 'Sign Up' : 'Log In';
    document.getElementById('switchModeTxt').innerHTML = isRegister ? 
      'Already have an account? <b style="color:#3797f0;">Log In</b>' : 
      'Don\'t have an account? <b style="color:#3797f0;">Sign Up</b>';
    document.getElementById('authErrorDisplay').style.display = 'none';
  }

  // Google Sign-In
  async function signInWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const res = await auth.signInWithPopup(provider);
      const user = res.user;
      await db.ref("users/" + user.uid).update({
        uid: user.uid,
        username: user.displayName.replace(/\s+/g, '').toLowerCase(),
        email: user.email,
        lastSeen: Date.now()
      });
    } catch(err) {
      showAuthError(err.message);
    }
  }

  // Email / Password Auth
  async function handleEmailAuth() {
    const email = document.getElementById('inputEmail').value.trim();
    const pass = document.getElementById('inputPassword').value.trim();
    const uname = document.getElementById('inputUsername').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

    if(!email || !pass) {
      showAuthError("Please enter email and password");
      return;
    }

    try {
      if(isRegister) {
        if(!uname) { showAuthError("Choose a username"); return; }
        const res = await auth.createUserWithEmailAndPassword(email, pass);
        await res.user.updateProfile({ displayName: uname });
        await db.ref("users/" + res.user.uid).set({
          uid: res.user.uid,
          username: uname,
          email: email,
          createdAt: Date.now()
        });
      } else {
        await auth.signInWithEmailAndPassword(email, pass);
      }
    } catch(err) {
      showAuthError(err.message);
    }
  }

  function showAuthError(msg) {
    const b = document.getElementById('authErrorDisplay');
    b.innerText = msg;
    b.style.display = 'block';
  }

  function logUserOut() {
    if(confirm("Log out of NineX?")) auth.signOut();
  }

  // Real-Time Auth State
  auth.onAuthStateChanged((user) => {
    if(user) {
      activeUser = user;
      document.getElementById('authOverlay').style.display = 'none';
      const handle = user.displayName || user.email.split('@')[0];
      
      document.getElementById('profileNameDisplay').innerText = handle;
      document.getElementById('profileHandleDisplay').innerText = '@' + handle;
      document.getElementById('profileBadge').innerText = handle[0].toUpperCase();
      document.getElementById('myStoryIcon').innerText = handle[0].toUpperCase();

      syncLiveChats();
      fetchDirectory();
      syncVoomReels();
    } else {
      activeUser = null;
      document.getElementById('authOverlay').style.display = 'flex';
    }
  });

  // User Search
  function fetchDirectory() {
    db.ref("users").on("value", snap => {
      registeredDirectory = snap.val() || {};
    });
  }

  function filterRealUsers() {
    const query = document.getElementById('liveUserSearch').value.trim().toLowerCase().replace('@', '');
    const wrap = document.getElementById('searchResultsList');
    if(!query) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }

    wrap.innerHTML = '';
    let hasMatch = false;
    Object.keys(registeredDirectory).forEach(uid => {
      const u = registeredDirectory[uid];
      if(u.username && u.username.includes(query)) {
        hasMatch = true;
        const div = document.createElement('div');
        div.style.padding = '8px 0';
        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        div.style.alignItems = 'center';
        div.innerHTML = `
          <div><b>@${u.username}</b> <span style="font-size:11px; opacity:0.6;">(${u.email})</span></div>
          <button style="background:#3797f0; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-weight:700; font-size:11px;" onclick="selectRecipient('${u.username}')">Message</button>
        `;
        wrap.appendChild(div);
      }
    });
    wrap.style.display = hasMatch ? 'block' : 'none';
  }

  function selectRecipient(name) {
    document.getElementById('searchResultsList').style.display = 'none';
    const field = document.getElementById('msgInputField');
    field.value = `@${name} `;
    field.focus();
  }

  // Realtime Live Messages
  function syncLiveChats() {
    db.ref("live_messages").limitToLast(50).on("value", snap => {
      const pane = document.getElementById('messagesStream');
      pane.innerHTML = '';
      const list = snap.val();
      if(list) {
        Object.keys(list).forEach(id => {
          const item = list[id];
          const isMine = activeUser && item.senderUid === activeUser.uid;
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${isMine ? 'mine' : 'theirs'}`;
          bubble.innerHTML = `
            ${!isMine ? `<div class="bubble-author">@${item.username}</div>` : ''}
            <div>${item.text}</div>
            <div class="bubble-meta">${item.time || ''}</div>
          `;
          pane.appendChild(bubble);
        });
        pane.scrollTop = pane.scrollHeight;
      }
    });
  }

  function pushNewMessage() {
    if(!activeUser) return;
    const input = document.getElementById('msgInputField');
    const txt = input.value.trim();
    if(!txt) return;

    const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    db.ref("live_messages").push({
      senderUid: activeUser.uid,
      username: activeUser.displayName || 'user',
      text: txt,
      time: timeString,
      timestamp: Date.now()
    });
    input.value = '';
  }

  // Real Reels Feed
  function handleReelUpload(e) {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 15 * 1024 * 1024) { alert("Max video size: 15MB"); return; }

    const reader = new FileReader();
    reader.onload = function(evt) {
      db.ref("reels").push({
        uploaderUid: activeUser.uid,
        username: activeUser.displayName || 'user',
        videoData: evt.target.result,
        timestamp: Date.now()
      });
      alert("Reel shared successfully!");
    };
    reader.readAsDataURL(file);
  }

  function syncVoomReels() {
    db.ref("reels").limitToLast(15).on("value", snap => {
      const feed = document.getElementById('reelsFeed');
      const all = snap.val();
      if(all) {
        feed.innerHTML = '';
        Object.keys(all).reverse().forEach(key => {
          const item = all[key];
          const node = document.createElement('div');
          node.className = 'reel-slot';
          node.innerHTML = `
            <video src="${item.videoData}" loop autoplay playsinline muted></video>
            <div class="reel-meta-info">
              <div class="reel-meta-user">@${item.username}</div>
            </div>
          `;
          feed.appendChild(node);
        });
      }
    });
  }

  // Real Camera Hardware
  async function launchRealCamera() {
    const v = document.getElementById('cameraElement');
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        v.srcObject = stream;
      } catch(err) {
        console.warn('Camera wrapper check:', err.message);
      }
    }
  }

  function setLens(sym) {
    document.getElementById('activeEmojiFilter').innerText = sym;
  }

  // Navigation
  function switchTab(tabId, el) {
    document.querySelectorAll('.screen-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.dock-action').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');

    if(tabId === 'lensTab') launchRealCamera();
  }
</script>
</body>
</html>

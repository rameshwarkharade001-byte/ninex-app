<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NineX Ecosystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --glass-surface: rgba(17, 24, 39, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --neon-emerald: #00E676;
      --neon-cyan: #00E5FF;
      --neon-rose: #FF1744;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --app-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--app-font);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-frame {
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      position: relative;
      background: radial-gradient(circle at 10% 10%, #064e3b20 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, #0284c720 0%, transparent 40%),
                  var(--bg-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 100;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
      border-color: var(--neon-emerald);
    }

    .screen-view {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 84px;
    }

    .screen-view.active {
      display: flex;
    }

    .stories-rail {
      display: flex;
      gap: 14px;
      padding: 16px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--glass-border);
    }

    .stories-rail::-webkit-scrollbar { display: none; }

    .story-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .story-ring {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(45deg, var(--neon-emerald), var(--neon-cyan));
    }

    .story-ring.seen {
      background: rgba(255, 255, 255, 0.15);
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      border: 2px solid var(--bg-dark);
    }

    .story-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 60px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }

    .bubble.received {
      align-self: flex-start;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .bubble.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #059669, #10B981);
      border-bottom-right-radius: 4px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
    }

    .sender-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--neon-cyan);
      margin-bottom: 2px;
    }

    .timestamp {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      align-items: center;
    }

    .chat-input-bar {
      position: absolute;
      bottom: 74px;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 50;
    }

    .chat-input-bar input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .action-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--neon-emerald);
      border: none;
      color: #000;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .reels-container {
      flex: 1;
      height: calc(100vh - 148px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .reel-item {
      height: 100%;
      position: relative;
      scroll-snap-align: start;
      background: #000;
    }

    .reel-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reel-sidebar {
      position: absolute;
      right: 16px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .reel-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 22px;
    }

    .ar-lens-viewport {
      height: calc(100vh - 240px);
      margin: 14px 16px;
      border-radius: 24px;
      background: #000;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .ar-lens-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .ar-graphic-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 90px;
      pointer-events: none;
    }

    .filters-carousel {
      height: 70px;
      display: flex;
      gap: 12px;
      padding: 0 20px;
      align-items: center;
      overflow-x: auto;
    }

    .filter-node {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--glass-surface);
      border: 2px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .filter-node.active {
      border-color: var(--neon-emerald);
      box-shadow: 0 0 15px var(--neon-emerald);
    }

    .call-network-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .participant-card {
      aspect-ratio: 0.9;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .call-status-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.4);
      color: var(--neon-emerald);
    }

    .crypto-fiat-card {
      margin: 20px 16px;
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
      border: 1px solid var(--glass-highlight);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .wallet-ops {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 0 16px 20px;
    }

    .wallet-op-btn {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .nav-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 74px;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .dock-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      transition: color 0.2s;
    }

    .dock-tab i {
      font-size: 18px;
    }

    .dock-tab.active {
      color: var(--neon-emerald);
    }
  </style>
</head>
<body>

<div class="app-frame">
  <div class="top-bar">
    <div class="brand-logo" id="headerTitle">NineX</div>
    <div class="top-actions">
      <div class="icon-btn" onclick="triggerSticker('🔥')"><i class="fa-solid fa-fire"></i></div>
      <div class="icon-btn" onclick="switchNav('walletTab', document.getElementById('walletDockBtn'), 'NineX Pay')"><i class="fa-solid fa-wallet"></i></div>
    </div>
  </div>

  <!-- 1. LIVE CHATS (POWERED BY FIREBASE REALTIME DB) -->
  <div id="chatsTab" class="screen-view active">
    <div class="stories-rail">
      <div class="story-unit">
        <div class="story-ring"><img class="story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" /></div>
        <span class="story-label">My Story</span>
      </div>
      <div class="story-unit">
        <div class="story-ring seen"><img class="story-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" /></div>
        <span class="story-label">Alex</span>
      </div>
      <div class="story-unit">
        <div class="story-ring"><img class="story-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" /></div>
        <span class="story-label">Sarah</span>
      </div>
      <div class="story-unit">
        <div class="story-ring seen"><img class="story-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100" /></div>
        <span class="story-label">Karan</span>
      </div>
    </div>

    <div class="chat-messages" id="chatList"></div>

    <div class="chat-input-bar">
      <div class="icon-btn" onclick="toggleStickers()"><i class="fa-regular fa-face-smile"></i></div>
      <input type="text" id="userMsgInput" placeholder="Send live message..." onkeydown="if(event.key==='Enter') dispatchMessage()" />
      <button class="action-circle-btn" onclick="dispatchMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- 2. REELS FEED -->
  <div id="voomTab" class="screen-view">
    <div class="reels-container">
      <div class="reel-item">
        <video loop autoplay muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-lights-at-night-42289-large.mp4"></video>
        <div class="reel-sidebar">
          <div class="reel-action-btn" onclick="this.style.color='#FF1744'"><i class="fa-solid fa-heart"></i><span>128K</span></div>
          <div class="reel-action-btn"><i class="fa-solid fa-comment-dots"></i><span>3.4K</span></div>
          <div class="reel-action-btn"><i class="fa-solid fa-share-nodes"></i><span>Share</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. AR LENS -->
  <div id="lensTab" class="screen-view">
    <div style="padding: 12px 20px 0; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:700; font-size:13px; color:var(--text-muted);">AR NEURAL LENS</span>
      <button onclick="bootHardwareCamera()" style="background:var(--neon-emerald); color:#000; border:none; padding:6px 14px; border-radius:12px; font-weight:700; font-size:12px;">Activate</button>
    </div>
    <div class="ar-lens-viewport">
      <video id="hardwareLens" autoplay playsinline muted></video>
      <div class="ar-graphic-overlay" id="arElement">🐰</div>
    </div>
    <div class="filters-carousel">
      <div class="filter-node active" onclick="applyFilter('🐰', this)">🐰</div>
      <div class="filter-node" onclick="applyFilter('🕶️', this)">🕶️</div>
      <div class="filter-node" onclick="applyFilter('👑', this)">👑</div>
      <div class="filter-node" onclick="applyFilter('🐯', this)">🐯</div>
      <div class="filter-node" onclick="applyFilter('⚡', this)">⚡</div>
    </div>
  </div>

  <!-- 4. CALLS -->
  <div id="callsTab" class="screen-view">
    <div class="call-network-grid">
      <div class="participant-card">
        <span class="call-status-badge">Host</span>
        <i class="fa-solid fa-user-astronaut" style="font-size: 40px; color: var(--neon-cyan);"></i>
        <b style="font-size: 13px; margin-top: 10px;">Rameshwar</b>
      </div>
      <div class="participant-card">
        <span class="call-status-badge">HD Audio</span>
        <i class="fa-solid fa-user-tie" style="font-size: 40px; color: var(--neon-emerald);"></i>
        <b style="font-size: 13px; margin-top: 10px;">Sarah</b>
      </div>
      <div class="participant-card">
        <span class="call-status-badge">Active</span>
        <i class="fa-solid fa-user-ninja" style="font-size: 40px; color: #a855f7;"></i>
        <b style="font-size: 13px; margin-top: 10px;">Alex</b>
      </div>
      <div class="participant-card">
        <span class="call-status-badge">Connected</span>
        <i class="fa-solid fa-user-secret" style="font-size: 40px; color: #f59e0b;"></i>
        <b style="font-size: 13px; margin-top: 10px;">Nova</b>
      </div>
    </div>
  </div>

  <!-- 5. WALLET -->
  <div id="walletTab" class="screen-view">
    <div class="crypto-fiat-card">
      <span style="font-size: 12px; font-weight:600; color: var(--text-muted);">NineX Pay Account</span>
      <h2 style="font-size: 34px; font-weight: 800; margin: 10px 0 20px;">₹ 45,850.00</h2>
      <div style="display:flex; gap:10px;">
        <button style="flex:1; padding:12px; background:var(--neon-emerald); color:#000; border:none; border-radius:14px; font-weight:700; font-size:13px;">Transfer</button>
        <button style="flex:1; padding:12px; background:rgba(255,255,255,0.1); color:#fff; border:none; border-radius:14px; font-weight:700; font-size:13px;">Request</button>
      </div>
    </div>
    <div class="wallet-ops">
      <div class="wallet-op-btn"><i class="fa-solid fa-qrcode" style="font-size:18px; color:var(--neon-cyan);"></i>Scan QR</div>
      <div class="wallet-op-btn"><i class="fa-solid fa-credit-card" style="font-size:18px; color:var(--neon-emerald);"></i>Cards</div>
      <div class="wallet-op-btn"><i class="fa-solid fa-bolt" style="font-size:18px; color:#eab308;"></i>Bills</div>
      <div class="wallet-op-btn"><i class="fa-solid fa-gift" style="font-size:18px; color:var(--neon-rose);"></i>Rewards</div>
    </div>
  </div>

  <div class="nav-dock">
    <button class="dock-tab active" onclick="switchNav('chatsTab', this, 'NineX')"><i class="fa-solid fa-comments"></i>Chats</button>
    <button class="dock-tab" onclick="switchNav('voomTab', this, 'VOOM Feed')"><i class="fa-solid fa-play"></i>VOOM</button>
    <button class="dock-tab" onclick="switchNav('lensTab', this, 'AR Lens')"><i class="fa-solid fa-camera"></i>Lens</button>
    <button class="dock-tab" onclick="switchNav('callsTab', this, 'Encrypted Calls')"><i class="fa-solid fa-phone"></i>Calls</button>
    <button class="dock-tab" id="walletDockBtn" onclick="switchNav('walletTab', this, 'NineX Pay')"><i class="fa-solid fa-wallet"></i>Pay</button>
  </div>
</div>

<script>
  // Real Firebase Realtime Database Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAkOC-P2vyQ9c8t0ZekGjSA3YXLbvSvK6M",
    authDomain: "ninex-messenger.firebaseapp.com",
    databaseURL: "https://ninex-messenger-default-rtdb.firebaseio.com",
    projectId: "ninex-messenger",
    storageBucket: "ninex-messenger.firebasestorage.app",
    messagingSenderId: "673406398185",
    appId: "1:673406398185:web:8b1a56ef371231a9a3eb8"
  };

  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref("live_messages");

  // Device User ID
  let myUserId = localStorage.getItem('nx_uid');
  if(!myUserId) {
    myUserId = 'User_' + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem('nx_uid', myUserId);
  }

  // Realtime Live Messages Sync
  dbRef.limitToLast(50).on('value', (snapshot) => {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    const messages = snapshot.val();
    if(messages) {
      Object.keys(messages).forEach((key) => {
        const data = messages[key];
        const isMe = data.senderId === myUserId;
        const msgDiv = document.createElement('div');
        msgDiv.className = `bubble ${isMe ? 'sent' : 'received'}`;
        
        if (data.type === 'sticker') {
          msgDiv.innerHTML = `<div style="font-size: 50px;">${data.text}</div>`;
        } else {
          msgDiv.innerHTML = `
            ${!isMe ? `<div class="sender-tag">${data.senderName}</div>` : ''}
            <div>${data.text}</div>
            <div class="timestamp">${data.time || ''} ${isMe ? '<i class="fa-solid fa-check-double"></i>' : ''}</div>
          `;
        }
        list.appendChild(msgDiv);
      });
      list.scrollTop = list.scrollHeight;
    }
  });

  // Real Send Message
  function dispatchMessage() {
    const field = document.getElementById('userMsgInput');
    const content = field.value.trim();
    if (!content) return;

    field.value = '';
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

    dbRef.push({
      text: content,
      senderId: myUserId,
      senderName: myUserId,
      type: 'text',
      time: timeStr,
      timestamp: Date.now()
    });
  }

  // Real Send Sticker
  function triggerSticker(sym) {
    dbRef.push({
      text: sym,
      senderId: myUserId,
      senderName: myUserId,
      type: 'sticker',
      timestamp: Date.now()
    });
  }

  function toggleStickers() {
    const pool = ['🔥', '⚡', '👑', '🚀', '🎉', '💎'];
    triggerSticker(pool[Math.floor(Math.random() * pool.length)]);
  }

  function switchNav(paneId, btnEl, titleText) {
    document.querySelectorAll('.screen-view').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.dock-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(paneId).classList.add('active');
    btnEl.classList.add('active');
    document.getElementById('headerTitle').innerText = titleText;

    if(paneId === 'lensTab') {
      bootHardwareCamera();
    }
  }

  async function bootHardwareCamera() {
    const video = document.getElementById('hardwareLens');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
      } catch (err) {
        console.warn('Camera wrapper check.');
      }
    }
  }

  function applyFilter(sym, node) {
    document.querySelectorAll('.filter-node').forEach(n => n.classList.remove('active'));
    node.classList.add('active');
    document.getElementById('arElement').innerText = sym;
  }
</script>
</body>
</html>
